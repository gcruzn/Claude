name: Build APK

on:
  push:
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Clave de firma fija (si está el secreto)
        env:
          SIDELOAD_KEYSTORE: ${{ secrets.SIDELOAD_KEYSTORE }}
        run: |
          if [ -n "$SIDELOAD_KEYSTORE" ]; then
            echo "$SIDELOAD_KEYSTORE" | base64 -d > app/sideload.p12
            echo "Firma: clave fija"
          else
            echo "::warning::Sin secreto SIDELOAD_KEYSTORE: firma debug del runner (cambia en cada build)"
          fi
      - name: Build release APK
        env:
          SIDELOAD_PASSWORD: ${{ secrets.SIDELOAD_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: patron-touch-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Commit APK to branch
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/PatronTouch.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/PatronTouch.apk
          git commit -m "APK compilado [skip ci]" || echo "sin cambios"
          git push origin HEAD:${GITHUB_REF_NAME}
