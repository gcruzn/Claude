name: Build APK

on:
  push:
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Clave de firma fija (si está el secreto)
        env:
          SIDELOAD_KEYSTORE: ${{ secrets.SIDELOAD_KEYSTORE }}
        run: |
          if [ -n "$SIDELOAD_KEYSTORE" ]; then
            echo "$SIDELOAD_KEYSTORE" | base64 -d > app/sideload.p12
            echo "Firma: clave fija"
          else
            echo "::warning::Sin secreto SIDELOAD_KEYSTORE: firma debug del runner (cambia en cada build)"
          fi
      - name: Build release APK
        env:
          SIDELOAD_PASSWORD: ${{ secrets.SIDELOAD_PASSWORD }}
        # Si falla, el motivo queda como anotación (se lee por la API pública sin iniciar sesión).
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -A6 -E "What went wrong|error:" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Commit APK to branch
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/Cerebro.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/Cerebro.apk
          git commit -m "APK compilado [skip ci]" || echo "sin cambios"
          git push origin HEAD:${GITHUB_REF_NAME}
