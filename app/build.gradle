plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.gcruz.patrontouch'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.gcruz.patrontouch'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave debug para poder instalarlo directo (sideload personal)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
