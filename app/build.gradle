plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.gcruz.patrontouch'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.gcruz.patrontouch'
        minSdk 26
        targetSdk 34
        versionCode 101
        versionName '6.6.6'
    }

    // Clave fija desde el secreto SIDELOAD_KEYSTORE del CI (el workflow la deja en
    // app/sideload.p12). Sin ella se firma con la clave debug del runner, que cambia en cada
    // build y obliga a desinstalar (se pierden patrones, sets y calibración).
    def sideloadFile = file('sideload.p12')
    signingConfigs {
        if (sideloadFile.exists()) {
            sideload {
                storeFile sideloadFile
                storeType 'pkcs12'
                storePassword System.getenv('SIDELOAD_PASSWORD') ?: ''
                keyAlias 'patrontouch'
                keyPassword System.getenv('SIDELOAD_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig sideloadFile.exists() ? signingConfigs.sideload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Shizuku (22-oct): permisos de ADB desde el propio celular, para leer los eventos del S Pen
    // sin PC (PenShizuku). Apache-2.0, https://github.com/RikkaApps/Shizuku-API
    def shizuku = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku"
    implementation "dev.rikka.shizuku:provider:$shizuku"
}
